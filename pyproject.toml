[project]
name = "evofl"
version = "0.1.0"
description = "EvoFed — Evolutionary Federated Learning (JAX)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [
  { name = "Mahi Rahimi", email = "mohammadmahdi76@Gmail.com" },
]
keywords = ["federated-learning", "evolution-strategies", "jax", "evofed"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
  # JAX stack (CPU wheels by default)
  "jax>=0.4.35,<0.5",
  "jaxlib>=0.4.35,<0.5",
  "chex>=0.1.87",
  "flax>=0.10.0",
  "optax>=0.2.3",
  "numpy>=1.26,<2.2",

  # Federated / experiment stack
  "wandb>=0.18.5",
  "tensorflow-datasets>=4.9.6",
  "tqdm>=4.66",
  "pyyaml>=6.0",
  "dotmap>=1.3.30",

  # Models / control / plotting (imported by project modules)
  "gymnax>=0.0.8",
  "tensorflow-probability>=0.24.0",
  "matplotlib>=3.8",
  "brax>=0.10.0",
  "torch>=2.2",
  "torchvision>=0.17",
]

[project.optional-dependencies]
# Re-resolve JAX against CUDA 12 pip wheels (NVIDIA GPU)
cuda12 = [
  "jax[cuda12]>=0.4.35,<0.5",
]
# Local CUDA 12 toolkit on the machine
cuda12-local = [
  "jax[cuda12_local]>=0.4.35,<0.5",
]

[project.urls]
Homepage = "https://github.com/mahi97/EvoFL"
Repository = "https://github.com/mahi97/EvoFL"
DOI = "https://doi.org/10.5281/zenodo.13884362"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["evosax", "utils", "backprop"]

[tool.hatch.build.targets.sdist]
include = [
  "evosax",
  "utils",
  "backprop",
  "configs",
  "args.py",
  "evofed.py",
  "fedavg.py",
  "bp.py",
  "README.md",
  "LICENSE",
]

[tool.uv]
package = true
